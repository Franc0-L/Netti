name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Ejecutar tests (vitest)
        run: npm run test

      - name: Pruebas de vista previa del administrador
        run: npm run test:admin-preview

      - name: Pruebas de integración de handlers del administrador
        run: npm run test:admin-e2e

      - name: Build de producción
        run: npm run build
