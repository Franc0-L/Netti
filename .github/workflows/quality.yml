name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, lint, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/netti
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/netti
      ADMIN_PASSWORD_HASH: ci-placeholder-not-a-real-password-hash
      BLOB_READ_WRITE_TOKEN: ci-placeholder
      CRON_SECRET: ci-placeholder-secret-with-more-than-32-characters
      PUBLIC_SITE_URL: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Resolve dependencies until the tracked lockfile is regenerated locally.
      - name: Resolve dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
