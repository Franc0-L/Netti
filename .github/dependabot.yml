version: 2

# Dependency updates open pull requests; the quality gates decide whether they
# can be merged. Nothing is updated automatically in production.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    groups:
      # Next.js and React are released together: keeping them in one group
      # avoids pull requests that only bump one of the two.
      next:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - 'eslint-config-next'
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades are a deliberate decision, not an automatic one: they
      # need a review of the breaking changes and a migration on its own
      # branch. Dependabot keeps proposing the minors and the patches.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'drizzle-kit'
        update-types: ['version-update:semver-major']
      # The types must match the Node major that runs the project (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    ignore:
      # A new major of an action can change its interface: it is reviewed and
      # adopted on purpose, not by a weekly pull request.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'
