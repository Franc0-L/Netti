<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel editorial — Netti</title>
    <style>
      [hidden] { display: none !important; }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #141218;
        --surface: #1e1b24;
        --surface-raised: #272232;
        --text: #f4effc;
        --muted: #b6adc9;
        --accent: #a78bfa;
        --accent-strong: #c9bbff;
        --accent-deep: #5b21b6;
        --border: #352d45;
        --red: #f16c79;
      }

      body {
        font-family: "Quicksand", ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Top bar */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }
      .brand {
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.04em;
        color: var(--text);
        text-decoration: none;
      }
      .brand span { color: var(--accent); }
      .top-bar nav { display: flex; gap: 0.6rem; align-items: center; flex-shrink: 0; }
      .top-bar a {
        padding: 0.45rem 0.85rem;
        border-radius: 0.6rem;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
        border: 1px solid transparent;
      }
      .top-bar a:hover { background: var(--surface-raised); color: var(--text); }
      .top-bar a.active { background: var(--accent); color: #17111f; }
      .user-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
      .user-actions button {
        background: transparent;
        border: 1px solid var(--red);
        color: var(--red);
        padding: 0.45rem 0.85rem;
        border-radius: 0.6rem;
        font: inherit;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .user-actions button:hover { background: var(--red); color: #141218; }

      /* Main layout */
      .app {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 280px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar h2 {
        padding: 1rem 1.25rem;
        font-size: 0.85rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
      }
      .sidebar ul { list-style: none; overflow-y: auto; flex: 1; }
      .sidebar li { margin: 0; }
      .sidebar a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1.25rem;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
        border-left: 3px solid transparent;
        transition: all 140ms ease;
      }
      .sidebar a:hover { background: var(--surface-raised); color: var(--text); }
      .sidebar a.active { background: var(--surface-raised); color: var(--accent-strong); border-left-color: var(--accent); }
      .sidebar-divider { border: 0; height: 1px; background: var(--border); margin: 0; }
      .sidebar .sidebar-nav { padding: 0.75rem 0; }
      .sidebar .sidebar-nav a { font-size: 0.85rem; padding: 0.65rem 1.25rem; }

      /* Editor area */
      .editor-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }
      .editor-header .title-group { display: flex; flex-direction: column; gap: 0.25rem; }
      #page-title { font-size: 1.25rem; font-weight: 700; color: var(--text); }
      #page-subtitle { font-size: 0.85rem; color: var(--muted); }
      .editor-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
      .editor-actions button {
        padding: 0.55rem 1rem;
        border-radius: 0.6rem;
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .editor-actions button:hover { border-color: var(--accent); color: var(--accent-strong); }
      .editor-actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #17111f;
        font-weight: 700;
      }
      .editor-actions button.primary:hover { background: var(--accent-strong); }

      /* Form */
      .form-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
      }
      #editor-form { display: flex; flex-direction: column; gap: 1.1rem; max-width: 900px; }
      .field { display: flex; flex-direction: column; gap: 0.45rem; }
      .field label { font-size: 0.85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
      .field input,
      .field textarea,
      .field select {
        width: 100%;
        padding: 0.6rem 0.85rem;
        border-radius: 0.6rem;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 0.95rem;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
      .field textarea { resize: vertical; min-height: 520px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .field.full { flex: 1; }
      .field.group-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }

      .metadata-section {
        border-top: 1px solid var(--border);
        padding-top: 1rem;
        margin-top: 0.5rem;
      }
      .metadata-section h3 {
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.75rem;
      }

      /* Image preview */
      .image-preview { margin-top: 0.5rem; }
      .image-preview img { max-width: 200px; border-radius: 0.6rem; border: 1px solid var(--border); background: var(--bg); }

      /* Messages */
      #error-msg { color: var(--red); font-size: 0.9rem; padding: 0.75rem; background: color-mix(in srgb, var(--red) 12%, transparent); border: 1px solid color-mix(in srgb, var(--red) 35%, transparent); border-radius: 0.6rem; display: none; }
      #success-msg { color: var(--accent-strong); font-size: 0.9rem; padding: 0.75rem; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 0.6rem; display: none; }

      /* Preview modal */
      .preview-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgb(0 0 0 / 70%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preview-modal.hidden { display: none !important; }
      .preview-modal-content {
        width: min(92vw, 1100px);
        height: min(85vh, 700px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      .preview-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface-raised);
        flex-shrink: 0;
      }
      .preview-modal-header h3 { font-size: 1rem; color: var(--text); }
      .preview-modal-header button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.45rem 0.85rem;
        border-radius: 0.6rem;
        font: inherit;
        cursor: pointer;
      }
      .preview-modal-header button:hover { background: var(--red); border-color: var(--red); color: #fff; }
      #preview-body {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        color: var(--text);
        line-height: 1.7;
        font-size: 1rem;
        background: var(--bg);
      }
      #preview-body h1, #preview-body h2, #preview-body h3 { color: var(--accent-strong); margin: 1rem 0 0.5rem; }
      #preview-body h1 { font-size: 1.6rem; }
      #preview-body h2 { font-size: 1.3rem; }
      #preview-body h3 { font-size: 1.1rem; }
      #preview-body p { margin: 0.75rem 0; }
      #preview-body img { max-width: 100%; height: auto; border-radius: 0.6rem; margin: 0.75rem 0; }
      #preview-body a { color: var(--accent); text-decoration: underline; }
      #preview-body ul, #preview-body ol { margin: 0.75rem 0 0.75rem 1.5rem; }
      #preview-body li { margin: 0.35rem 0; }
      #preview-body blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; margin: 0.75rem 0; color: var(--muted); font-style: italic; }
      #preview-body hr { border: 0; height: 1px; background: var(--border); margin: 1rem 0; }

      /* Empty state */
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        text-align: center;
        padding: 2rem;
      }
      .empty-state h2 { color: var(--text); margin-bottom: 0.5rem; }

      .checkbox-field { display: flex; align-items: center; gap: 0.6rem; }
      .checkbox-field input { width: auto; }

      @media (max-width: 900px) {
        .sidebar { display: none; }
        .form-wrap { padding: 1rem; }
        #editor-form { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="top-bar">
      <a class="brand" href="/" aria-label="Inicio — Netti">Netti<span>.</span></a>
      <nav id="top-collections"></nav>
      <div class="user-actions">
        <button id="logout-btn" type="button">Cerrar sesión</button>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar">
        <h2>Colección</h2>
        <ul id="collection-list"></ul>
        <hr class="sidebar-divider" />
        <nav class="sidebar-nav">
          <a href="#" id="trash-link">🗑️ Papelera</a>
        </nav>
      </aside>

      <main class="editor-wrap">
        <div class="editor-header">
          <div class="title-group">
            <h1 id="page-title">Nuevo artículo</h1>
            <p id="page-subtitle">Rellena los campos y guardá en GitHub.</p>
          </div>
          <div class="editor-actions">
            <button id="preview-btn" type="button">Vista previa</button>
            <button id="save-btn" type="button" class="primary">Guardar</button>
            <button id="new-btn" type="button">Nuevo</button>
          </div>
        </div>

        <div class="form-wrap">
          <form id="editor-form" novalidate>
            <input type="hidden" id="edit-id" />
            <input type="hidden" id="edit-collection" />

            <div class="field">
              <label for="edit-title">Título</label>
              <input id="edit-title" required />
            </div>

            <div class="field">
              <label for="edit-slug">Slug</label>
              <input id="edit-slug" required />
            </div>

            <div class="field">
              <label for="edit-description">Descripción</label>
              <textarea id="edit-description" rows="2"></textarea>
            </div>

            <div class="field full">
              <label for="edit-body">Cuerpo (Markdown)</label>
              <textarea id="edit-body"></textarea>
            </div>

            <!-- Metadata por colección -->
            <div class="metadata-section" id="metadata-games" data-collections="games">
              <h3>Juego</h3>
              <div class="field group-row">
                <div class="field">
                  <label for="field-release-year">Año de lanzamiento</label>
                  <input id="field-release-year" type="number" />
                </div>
                <div class="field">
                  <label for="field-platforms">Plataformas (coma separada)</label>
                  <input id="field-platforms" />
                </div>
                <div class="field">
                  <label for="field-genres">Géneros (coma separada)</label>
                  <input id="field-genres" />
                </div>
              </div>
              <div class="field group-row">
                <div class="field">
                  <label for="field-developer">Desarrollador</label>
                  <input id="field-developer" />
                </div>
                <div class="field">
                  <label for="field-publisher">Distribuidor</label>
                  <input id="field-publisher" />
                </div>
              </div>
            </div>

            <div class="metadata-section" id="metadata-common" data-collections="reviews,news,guides">
              <h3>Metadatos comunes</h3>
              <div class="field group-row">
                <div class="field">
                  <label for="field-publishedAt">Fecha de publicación (AAAA-MM-DD)</label>
                  <input id="field-publishedAt" type="date" />
                </div>
                <div class="field">
                  <label for="field-author">Autor</label>
                  <input id="field-author" />
                </div>
              </div>
            </div>

            <div class="metadata-section" id="metadata-news" data-collections="news">
              <h3>Noticia</h3>
              <div class="field group-row">
                <div class="field">
                  <label for="field-category">Categoría</label>
                  <input id="field-category" />
                </div>
                <div class="field">
                  <label for="field-source-name">Fuente</label>
                  <input id="field-source-name" />
                </div>
                <div class="field">
                  <label for="field-source-url">URL de la fuente</label>
                  <input id="field-source-url" />
                </div>
              </div>
            </div>

            <div class="metadata-section" id="metadata-reviews" data-collections="reviews">
              <h3>Reseña</h3>
              <div class="field group-row">
                <div class="field">
                  <label for="field-score-reason">Justificación de puntuación</label>
                  <input id="field-score-reason" />
                </div>
                <div class="field">
                  <label for="field-verdict">Veredicto</label>
                  <input id="field-verdict" />
                </div>
              </div>
              <div class="field checkbox-field" data-collections="reviews,guides">
                <input type="checkbox" id="field-featured" />
                <label for="field-featured">Destacado</label>
              </div>
            </div>

            <div class="field">
              <label for="edit-tags">Etiquetas</label>
              <select id="edit-tags" multiple size="4">
                <option value="jugabilidad">Jugabilidad</option>
                <option value="historia">Historia</option>
                <option value="graficos">Gráficos</option>
                <option value="sonido">Sonido</option>
                <option value="indie">Indie</option>
                <option value="AAA">AAA</option>
                <option value="lanzamiento">Lanzamiento</option>
                <option value="analisis">Análisis</option>
              </select>
            </div>

            <div class="field">
              <label for="edit-cover-alt">Texto alternativo de la portada</label>
              <input id="edit-cover-alt" />
            </div>

            <div class="field">
              <label for="image-input">Imagen de portada</label>
              <input type="file" id="image-input" accept="image/*" />
              <div id="image-preview" class="image-preview"></div>
            </div>

            <div id="error-msg" class="error-msg" role="alert"></div>
            <div id="success-msg" class="success-msg" role="status"></div>
          </form>
        </div>
      </main>
    </div>

    <div id="preview-modal" class="preview-modal hidden">
      <div class="preview-modal-content">
        <div class="preview-modal-header">
          <h3>Vista previa</h3>
          <button id="close-preview" type="button">Cerrar</button>
        </div>
        <div id="preview-body"></div>
      </div>
    </div>

    <script type="module" src="/admin/js/panel.js"></script>
  </body>
</html>
